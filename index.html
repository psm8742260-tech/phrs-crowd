<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHRS Crowd Console</title>
    <script>
      // 1. Immediately wipe any stuck Service Workers or stale caches causing white screens
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
      } catch (e) {}

      // 2. Safe localStorage shim in case cookies or storage are partitioned/blocked in preview iframe
      try {
        var testKey = '__test_ls__';
        window.localStorage.setItem(testKey, '1');
        window.localStorage.removeItem(testKey);
      } catch (e) {
        var memoryStore = {};
        window.localStorage = {
          getItem: function(k) { return memoryStore[k] || null; },
          setItem: function(k, v) { memoryStore[k] = String(v); },
          removeItem: function(k) { delete memoryStore[k]; },
          clear: function() { memoryStore = {}; }
        };
      }
    </script>
    <meta name="description" content="PHRS Crowd - Lightweight VPS Self-Hosted Cloud Platform Console." />
    <meta property="og:title" content="PHRS Crowd Console" />
    <meta property="og:description" content="PHRS Crowd - Lightweight VPS Self-Hosted Cloud Platform Console." />
